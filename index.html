<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ListaTarefas-style.css">
    <title>Lista de Tarefas - Projeto DNC</title>
    <script src="ListaTarefasJS.js"></script>
</head>
<body>
    <main>
        <h1>Lista de tarefas</h1>
        <section id="creat-toDo-section">
            <form id="creat-toDo-form">
                <input 
                type="text" 
                id="description" 
                name="description"
                class="input-description"
                aria-label="Qual tarefa deseja cadastrar?" 
                placeholder="Qual tarefa deseja cadastrar?"
                />
                <button type="submit" id="save-task" aria-label="Cadastrar tarefa" class="add-task-btn">+</button>
            </form>
        </section>
        <section class="toDo-list-section">
            <ul id="toDo-list"></ul>
        </section>
	<footer id="toDo-footer">
		<button onclick="removeDoneTasks()" class="remove-done-tasks-btn">
			Remover tarefas concluídas
		</button>
	</footer>
    </main>
</body>
</html>
